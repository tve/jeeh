script [find board/st_nucleo_f3.cfg]

adapter srst delay 0 ;# get rid of a small-but-superfluous 100 ms delay

source serial.tcl

set fcpu 72000000
set fswo 2000000

$_CHIPNAME.tpiu configure \
                -protocol uart -traceclk $fcpu -pin-freq $fswo -output :6464
$_CHIPNAME.tpiu enable
itm ports on

$_TARGETNAME configure -event trace-config {
    poll off ;# no need to poll for programming and ITM / SWO use
}
