[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_g431kb
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Werror -Wno-format -DXTAL=0
lib_deps = symlink://../..
monitor_speed = 115200
board_leds = B8
board_uart = N:USART2 P:A2:UH7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_build.f_cpu = 170000000

[env:blink]
[env:serio]
