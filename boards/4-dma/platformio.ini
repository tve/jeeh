[platformio]
# re-use the settings from 1-blink
extra_configs = ../1-blink/platformio.ini

[env]
monitor_speed = 2000000

# ....d = Discovery boards
# ....k = Nucleo-32 boards
# ....r = Nucleo-64 boards
# ....z = Nucleo-144 boards

[env:f103r]
board_uart = N:USART2 P:A2:U1,A3 F:36 D:1 L:Channel T:7 R:6 C:2,2 O:1

[env:f303k]
build_flags = ${env.build_flags} -DXTAL=0
board_uart = N:USART2 P:A2:7,A15 F:36 D:1 L:CH T:7 R:6 C:2,2 O:1

[env:f303z]
board_uart = N:USART3 P:D8:7,D9 F:36 D:1 L:CH T:3 R:1 C:4,4 O:1

[env:f334r]
board_uart = N:USART2 P:A2:U7,A3 F:36 D:1 L:CH T:7 R:6 C:2,2 O:1

[env:f407d]
board_uart = N:USART2 P:A2:U7,A3 F:84 D:1 L:Stream T:6 R:5 C:4,4

#[env:f401r]
#board_uart = N:USART2 P:A2:U7,A3 F:42

[env:f411bp]
board_uart = N:USART1 P:A9:U7,A10 F:100 D:2 L:Stream T:7 R:5 C:4,4

[env:f411r]
