[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format -DXTAL=0
lib_deps = symlink://../..
board = nucleo_g431kb
board_leds = B8
board_pins = vcc:B6 bmp:A11 lcd:A12 sram:B0 sd:A7
board_uart = N:USART2 P:A2:U7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_spi = N:SPI1 P:B5:H5,B4,B3,A11:HP F:170 D:1 L:CH T:3 R:4 C:11,10 O:1
board_i2c = N:I2C1 P:B7:OH4,A15 F:170 D:1 L:CH T:3 R:4 C:17,16 O:1
board_build.f_cpu = 160000000
monitor_speed = 2000000

[env:serial]
[env:i2c]
[env:dog]
[env:oled]
[env:imu]
[env:pulses]
[env:bmp390i]
[env:bmp390s]
[env:fram]
[env:sram]
[env:sht21]
[env:lcd]
[env:sdspi]
[env:shell]
[env:ni2c]
