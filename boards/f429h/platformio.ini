[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Werror -Wno-format -DXTAL=25
board = disco_f429zi
board_leds = B0 B1 C13 A4
board_uart = N:USART1 P:A9:7,A10 F:90 D:2 L:Stream T:7 R:5 C:4,4 O:0
lib_deps = symlink://../..
upload_protocol = jlink
#upload_flags = -c, adapter serial 066EFF565251887067065644
#monitor_port = hwgrep://066EFF565251887067065644
monitor_speed = 921600

[env:gpio]
[env:lcd]
[env:font]
[env:life]
[env:ram]
