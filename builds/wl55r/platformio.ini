[platformio]
extra_configs = ../etc/common.ini
src_dir = ../../tests/basic

[env]
extends = common
board = nucleo_wl55jc
board_exti = IN:B7 OUT:B6
board_leds = B15 B9 B11
#board_uart = N:USART2 P:A2:7,A3 F:48 D:1 L:CH T:1 R:2 C:20,19 O:1
board_uart = N:USART1 P:B6:7,B7 F:48 D:1 L:CH T:1 R:2 C:18,17 O:1
board_build.f_cpu = 48000000
build_flags = ${common.build_flags} -DCORE_CM4 -DSWO_FREQ=6000000
