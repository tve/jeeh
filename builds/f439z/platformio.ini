[platformio]
src_dir = ../../tests/basic

[env]
platform = ststm32
framework = cmsis

board = nucleo_f439zi
board_exti = G14 G9
board_leds = B0
#board_uart = N=USART3 P=D8:7,D9 F=45 D=1 L=Stream T=3 R=1 C=4,4
board_uart = N=USART6 P=G14:8,G9 F=90 D=2 L=Stream T=6 R=2 C=5,5

board_build.f_cpu = 180000000
board_build.ldscript = ram.ld
build_src_filter = +<${PIOENV}-*.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format -g
lib_deps = symlink://../..
upload_protocol = custom
monitor_speed = 115200
extra_scripts = post:pio-extra.py

