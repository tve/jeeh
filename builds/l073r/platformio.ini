[platformio]
extra_configs = ../etc/common.ini
src_dir = ../../tests/basic

[env]
extends = common
board = nucleo_l073rz
board_exti = A3 A2
board_leds = A5
#board_uart = N=USART1 P=A9:7,A10 F=80 D=1 L=Channel T=4 R=5 C=2,2 O=1
