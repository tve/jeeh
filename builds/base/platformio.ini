[platformio]
default_envs = g431k
src_dir = .

[env]
targets = upload
platform = ststm32
framework = cmsis
board = nucleo_g431kb
board_build.f_cpu = 160000000
build_src_filter = +<${PIOENV}.cpp>
build_flags =
  -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format
  -Itest -DXTAL=0 -DMYSYSTICK -g
lib_deps = symlink://../.., unity
monitor_speed = 10000000
test_speed = 10000000

[env:g431k]
# dummy, only used for "pio test"

[env:blink]
[env:fast]
[env:serial]
