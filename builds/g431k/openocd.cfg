script [find board/st_nucleo_g4.cfg]

adapter srst delay 0 ;# fixed: the 100 default causes swo output to be missed!
reset_config srst_push_pull

set fcpu 16000000
set fswo 1000000

$_CHIPNAME.tpiu configure \
                    -protocol uart -traceclk $fcpu -pin-freq $fswo -output -
$_CHIPNAME.tpiu enable
itm port 0 on

$_TARGETNAME configure -event reset-start {
	adapter speed 1000 ;# avoid the default 2000 kHz warning
}
