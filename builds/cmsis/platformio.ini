[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_g431kb
build_src_filter = +<${PIOENV}.cpp>

[env:main]

[env:stub]

[env:ram]
build_src_filter = +<main.cpp>
board_build.ldscript = ram.ld
upload_protocol = custom
upload_command = st-flash --reset write $SOURCE 0x20000200
