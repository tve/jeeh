[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format
lib_deps = symlink://../..
# l412r
board = nucleo_l412rb_p
board_leds = B13
board_build.f_cpu = 80000000
monitor_speed = 1000000

[env:blink]
[env:dcf77]
