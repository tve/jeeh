[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = olimexino_stm32f3
board_leds = A5 A1
board_uart = N:USART1 P:A9:7,A10 F:72 D:1 L:CH T:1 R:2 C:25,24 O:1
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format
lib_deps = symlink://../..
monitor_speed = 2000000

[env:blink]
[env:fast]
[env:serial]
[env:dcf77]
