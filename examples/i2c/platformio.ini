[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_l432kc
build_src_filter = +<${PIOENV}.cpp>
board_leds = B3
board_uart = N:USART2 P:A2:7,A15:3 F:80 D:1 L:CH T:7 R:6 C:2,2 O:1
board_i2c = N:I2C1 P:B7:OV4,B6 F:80 D:1 L:CH T:7 R:6 C:2,2 O:1
build_flags = -std=c++17 -Wall -Werror -Wno-format
lib_deps = symlink://../..
#upload_flags = -c, adapter serial 066EFF565251887067065644
#monitor_port = hwgrep://066EFF565251887067065644
monitor_speed = 1000000

[env:detect]
[env:imu]
[env:oled]
