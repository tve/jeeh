[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_l432kc
build_src_filter = +<${PIOENV}.cpp>
board_leds = B3
board_uart = N:USART2 P:A2:7,A15:3 F:80 D:1 L:CH T:7 R:6 C:2,2 O:1
board_i2c = N:I2C1 P:B7:OV4,B6 F:80 D:2 L:CH T:7 R:6 C:5,5 O:1
build_flags = -std=c++17 -Wall -Werror -Wno-format
lib_deps = symlink://../..
monitor_speed = 1000000

[env:detect]
[env:imu]
[env:oled]

[fram]
build_src_filter = +<fram.cpp>
board = nucleo_g431kb
board_leds = B8
board_uart = N:USART2 P:A2:UH7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_i2c = N:I2C1 P:B7:OH4,A15 F:170 D:1 L:CH T:3 R:4 C:17,16 O:1

[env:fram-gpio]
extends = fram
build_flags = ${env.build_flags} -DUSE_GPIO
[env:fram-poll]
extends = fram
build_flags = ${env.build_flags} -DUSE_POLL
[env:fram-sync]
extends = fram
build_flags = ${env.build_flags} -DUSE_SYNC
[env:fram-call]
extends = fram
build_flags = ${env.build_flags} -DUSE_CALL
