[platformio]
extra_configs = ../pio-common.ini
src_dir = .

[env:detect]
extends = g431k, poll

[fram]
build_src_filter = +<fram.cpp>
[env:fram-gpio]
extends = fram, g431k, gpio
[env:fram-poll]
extends = fram, g431k, poll
[env:fram-sync]
extends = fram, g431k, sync
[env:fram-call]
extends = fram, g431k, call

[imu]
build_src_filter = +<imu.cpp>
[env:imu-gpio]
extends = imu, l432k, gpio
[env:imu-poll]
extends = imu, l432k, poll
[env:imu-sync]
extends = imu, l432k, sync
[env:imu-call]
extends = imu, l432k, call

[oled]
build_src_filter = +<oled.cpp>
[env:oled-gpio]
extends = oled, l432k, gpio
[env:oled-poll]
extends = oled, l432k, poll
[env:oled-sync]
extends = oled, l432k, sync
[env:oled-call]
extends = oled, l432k, call
