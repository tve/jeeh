[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_l432kc
build_src_filter = +<${PIOENV}.cpp>
board_leds = B3
board_uart = N:USART2 P:A2:7,A15:3 F:80 D:1 L:CH T:7 R:6 C:2,2 O:1
board_i2c = N:I2C1 P:B7:OH4,B6 F:80 D:2 L:CH T:7 R:6 C:5,5 O:1
build_flags = -std=c++17 -Wall -Werror -Wno-format
lib_deps = symlink://../..
monitor_speed = 115200

[env:detect]

[env:oled-gpio]
build_src_filter = +<oled.cpp>
board_mode = gpio
[env:oled-poll]
build_src_filter = +<oled.cpp>
board_mode = poll
[env:oled-sync]
build_src_filter = +<oled.cpp>
board_mode = sync
[env:oled-call]
build_src_filter = +<oled.cpp>
board_mode = call

[env:imu-gpio]
build_src_filter = +<imu.cpp>
board_mode = gpio
[env:imu-poll]
build_src_filter = +<imu.cpp>
board_mode = poll
[env:imu-sync]
build_src_filter = +<imu.cpp>
board_mode = sync
[env:imu-call]
build_src_filter = +<imu.cpp>
board_mode = call

[fram]
build_src_filter = +<fram.cpp>
board = nucleo_g431kb
board_leds = B8
board_uart = N:USART2 P:A2:UH7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_i2c = N:I2C1 P:B7:OH4,A15 F:170 D:1 L:CH T:3 R:4 C:17,16 O:1

[env:fram-gpio]
extends = fram
board_mode = gpio
[env:fram-poll]
extends = fram
board_mode = poll
[env:fram-sync]
extends = fram
board_mode = sync
[env:fram-call]
extends = fram
board_mode = call
