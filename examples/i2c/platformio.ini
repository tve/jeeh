[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_l432kc
build_flags = -std=c++17 -Wall -Werror -Wno-format
lib_deps = symlink://../..
monitor_speed = 115200
board_uart = N=USART2 P=A2:7,A15:3 F=80 D=1 L=CH T=7 R=6 C=2,2 O=1

[env:nukkie]
upload_flags = -c, adapter serial 066EFF565251887067065644
monitor_port = hwgrep://066EFF565251887067065644
