[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format
lib_deps = symlink://../..
board = disco_g031j6
board_leds = A12
board_build.f_cpu = 64000000
monitor_speed = 115200

[env:blink]
[env:tick]
