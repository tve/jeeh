[platformio]
extra_configs = ../pio-common.ini
src_dir = .

[env:blink]
extends = l031k

[recv]
build_src_filter = +<recv.cpp>
[env:recv-gpio]
extends = recv, l031k, gpio
[env:recv-poll]
extends = recv, l031k, poll
[env:recv-sync]
extends = recv, l031k, sync
[env:recv-call]
extends = recv, l031k, call
