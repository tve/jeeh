[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format -DXTAL=0
lib_deps = symlink://../..
# g474r
board = nucleo_g474re
board_leds = A5
board_uart2 = N:USART2 P:A2:7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_spi = N:SPI1 P:A7:H5,A6,A5,B6:HP F:170 D:1 L:CH T:3 R:4 C:11,10 O:1
board_build.f_cpu = 160000000
monitor_speed = 10000000

[env:blink]
[env:tick]
[env:lcd]
[env:sdspi]
[env:shell]
