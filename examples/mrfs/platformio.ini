[platformio]
extra_configs = ../pio-common.ini
src_dir = .

[chip]
#extends = g431k
extends = f407deb

[env:add]
extends = chip
[env:del]
extends = chip
[env:dump]
extends = chip
[env:flash]
extends = chip
[env:format]
extends = chip
[env:list]
extends = chip
[env:show]
extends = chip

[spif]
build_src_filter = +<spif.cpp>
[env:spif-gpio]
extends = spif, f407deb, gpio
[env:spif-poll]
extends = spif, f407deb, poll
[env:spif-sync]
extends = spif, f407deb, sync
[env:spif-call]
extends = spif, f407deb, call
