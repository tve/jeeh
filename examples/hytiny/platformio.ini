[platformio]
extra_configs = ../pio-common.ini
src_dir = .

[f103hy]
board = hy_tinystm103tb
board_leds = A1
board_uart = N:USART1 P:A9:7,A10 F:72 D:1 L:Channel T:4 R:5 C:0,0 O:1
board_spi = N:SPI1 P:A7:5,A6:F,A5:5,A4:P F:72 D:1 L:Channel T:3 R:2 C:0,0 O:1
board_rfm69 = dios:B5:F,B3,B4,B0,A15 nrst:A8
upload_protocol = stlink

[env:blink]
extends = f103hy

[recv]
build_src_filter = +<recv.cpp>
[env:recv-gpio]
extends = recv, f103hy, gpio
[env:recv-poll]
extends = recv, f103hy, poll
[env:recv-sync]
extends = recv, f103hy, sync
[env:recv-call]
extends = recv, f103hy, call
