[platformio]
src_dir = .

[common]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format -g
lib_deps = symlink://../..
monitor_speed = 115200
monitor_port = hwgrep://066CFF515049657187154330
upload_flags = -c, adapter serial 066CFF515049657187154330

[env]
extends = common
board = nucleo_f439zi
board_exti = G14 G9
board_leds = B0 B7 B14
board_uart = N=USART3 P=D8:7,D9 F=45 D=1 L=Stream T=3 R=1 C=4,4
board_build.f_cpu = 180000000

[env:blink]
