[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format
lib_deps = symlink://../..
# f413z
board = nucleo_f413zh
board_leds = B0 B7 B14
board_uart = N:USART3 P:D8:7,D9 F:50 D:1 L:Stream T:3 R:1 C:4,4
board_build.f_cpu = 100000000
monitor_speed = 1000000

[env:blink]
