[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror
lib_deps = symlink://../..

#############################################  Discovery boards

[env:f723d]
board = disco_f723ie
build_flags = ${env.build_flags} -DLED='"B1"'

[env:f750d]
board = disco_f750n8
build_flags = ${env.build_flags} -DLED='"I1"'

[env:g031d]
board = disco_g031j6
build_flags = ${env.build_flags} -DLED='"A12"'
upload_port = /Volumes/NODE_G031J6

#############################################  Nucleo-32 boards (STM32...K...)

[env:g431k]
board = nucleo_g431kb
build_flags = ${env.build_flags} -DLED='"B8"'

[env:l031k]
board = nucleo_l031k6
build_flags = ${env.build_flags} -DLED='"B3"'

[env:l432k]
board = nucleo_l432kc
build_flags = ${env.build_flags} -DLED='"B3"'

#############################################  Nucleo-64 boards (STM32...R...)

[env:f103r]
board = nucleo_f103rb
build_flags = ${env.build_flags} -DLED='"A5"'

[env:g431r]
board = nucleo_g431rb
build_flags = ${env.build_flags} -DLED='"A5"'

#############################################  Nucleo-144 boards (STM32...Z...)

[env:f303z]
board = nucleo_f303ze
build_flags = ${env.build_flags} -DLED='"B0"'

[env:f439z]
board = nucleo_f439zi
build_flags = ${env.build_flags} -DLED='"B0"'
