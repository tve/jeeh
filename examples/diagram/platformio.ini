[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
board = nucleo_g431kb
board_build.f_cpu = 170000000
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -DXTAL=0
board_leds = B8
board_uart = N:USART2 P:A2:UH7,A3 F:170 D:1 L:CH T:1 R:2 C:27,26 O:1
board_i2c = N:I2C1 P:B7:OH4,A15 F:170 D:1 L:CH T:3 R:4 C:17,16 O:1
board_spi = N:SPI1 P:B5:H5,B4,B3,A11:HP F:170 D:1 L:CH T:3 R:4 C:11,10 O:1
build_src_filter = +<${PIOENV}.cpp>
lib_deps = symlink://../..
monitor_speed = 115200

[env:blink]
[env:pins]
[env:tracer]

[trace]
build_flags = ${env.build_flags} -DTRACE -I.

[env:wait]
extends = trace
[env:coma]
extends = trace
[env:thread]
extends = trace
