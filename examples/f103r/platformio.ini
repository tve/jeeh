[platformio]
src_dir = .

[env]
platform = ststm32
framework = cmsis
build_src_filter = +<${PIOENV}.cpp>
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -Werror -Wno-format -DXTAL=8
lib_deps = symlink://../..
board = nucleo_f103rb
board_leds = A5
board_build.f_cpu = 72000000
monitor_speed = 500000

[env:blink]
[env:tick]
